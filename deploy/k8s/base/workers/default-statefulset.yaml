apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: harness-default-worker
spec:
  # no Service: workers register their pod IP with the server
  serviceName: ""
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: harness-worker
      type: default
  template:
    metadata:
      labels:
        app: harness-worker
        type: default
    spec:
      containers:
        - name: worker
          image: default-harness-worker
          envFrom:
            - configMapRef:
                name: harness-config
            - secretRef:
                name: harness-secrets
          env:
            # harness-default-worker-0, harness-default-worker-1, …: deps and placement keys stay with the name
            - name: WORKER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SERVER_URL
              value: http://harness-server:3000
          # bwrap, pasta, nft and the sandbox cgroups
          securityContext:
            privileged: true
          ports:
            - name: internal
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: internal
            periodSeconds: 10
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces
            - name: deps
              mountPath: /tmp/workspace-deps
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: harness-workspaces
        - name: deps
          emptyDir: {}
