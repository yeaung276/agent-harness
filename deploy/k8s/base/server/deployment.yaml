apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harness-server
  template:
    metadata:
      labels:
        app: harness-server
    spec:
      containers:
        - name: server
          image: harness-server
          envFrom:
            - configMapRef:
                name: harness-config
            - secretRef:
                name: harness-secrets
            - secretRef:
                name: harness-server-secrets
          ports:
            - name: api
              containerPort: 3000
            - name: proxy
              containerPort: 3001
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            periodSeconds: 10
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: harness-workspaces
