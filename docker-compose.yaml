services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: harness/build/server.Dockerfile
    env_file: harness/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      WORKSPACES_DIR: /workspaces
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - workspaces:/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://localhost:3000/readyz')).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: harness/build/worker.Dockerfile
    env_file: harness/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      WORKSPACES_DIR: /workspaces
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      REDIS_URL: redis://redis:6379
      WORKER_NAME: worker-0
      SERVER_URL: http://server:3000
    # bwrap: the worker delegates its own cgroup tree to bun
    privileged: true
    cgroup: private
    volumes:
      - workspaces:/workspaces
    depends_on:
      server:
        condition: service_healthy

  worker-1:
    build:
      context: .
      dockerfile: harness/build/worker.Dockerfile
    env_file: harness/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      WORKSPACES_DIR: /workspaces
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      REDIS_URL: redis://redis:6379
      WORKER_NAME: worker-1
      SERVER_URL: http://server:3000
    privileged: true
    cgroup: private
    volumes:
      - workspaces:/workspaces
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  workspaces:
